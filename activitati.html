<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheets/style.css">
    <link rel="stylesheet" href="stylesheets/activitati_style.css">
    <title>Activități | Planific</title>
    <script src="https://kit.fontawesome.com/8a09abd08f.js" crossorigin="anonymous"></script>
    <script src="scripts/login.js" type="module"></script>
</head>
<body>
    <div id="body-content">
        <nav id="side-navbar">
            <h1>Planific <i class="fa-solid fa-clipboard-check"></i></h1>
            <div id="side-navbar-buttons">
                <a href="profil.html"><i class="fa-solid fa-user"></i>Profil</a>
                <a href="activitati.html"><i class="fa-solid fa-list"></i> Activități</a>
                <a href="obiective.html"><i class="fa-solid fa-bullseye"></i> Obiective</a>
            </div>

            <div id="settings">
                <div>
                    <button id="logout-btn">Delogheaza-te</button>
                </div>
                <button id="settings-btn"><i class="fa-solid fa-gear"></i> Setări</button>
            </div>
        </nav>
        <main>
            <h1>Activități</h1>
            <br>
            <section id="activity-container">
            </section>
            <br><br>
            <section id="create-activity-container">
                <h2>Ai o nouă activitate?</h2>
                <button class="primary-btn" id="create-activity-menu-button">Creează Activitate <i class="fa-solid fa-arrow-up-from-bracket"></i></button>
            </section>

            <form id="new-activity-creator" class="hidden">
                <div>
                    <div style="text-align: right;">
                        <button id="close-new-activity-creator" class="primary-btn">
                            <i class="fa-solid fa-x"></i>
                        </button>
                    </div>
                    <label for="new-activity-title">Titlu Activitate</label>
                    <input id="new-activity-title" placeholder="Introdu titlul activității" required/>
                    <label for="new-objective-description">Descriere</label>
                        
                    <textarea id="new-objective-description" name="new-objective-description" rows="4" cols="50" placeholder="Scrie o scurtă descriere a activității" required></textarea>
                    <br>
                    <button class="primary-btn" id="add-activity-btn">Creeaza Activitate <i class="fa-solid fa-plus"></i></button>
                </div>
            </form>
        </main>
    </div>
    <script src="scripts/displayActivities.js" type="module"></script>
</body>
</html>
